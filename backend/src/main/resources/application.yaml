spring:
  application:
    name: curatium-backend
  profiles:
    default: local
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

curatium:
  frontend-origin: ${CURATIUM_FRONTEND_ORIGIN:http://localhost:5173}
  art-institute:
    base-url: ${CURATIUM_ART_INSTITUTE_BASE_URL:https://api.artic.edu/api/v1}
    iiif-base-url: ${CURATIUM_ART_INSTITUTE_IIIF_BASE_URL:https://www.artic.edu/iiif/2}
    connect-timeout: ${CURATIUM_ART_INSTITUTE_CONNECT_TIMEOUT:2s}
    read-timeout: ${CURATIUM_ART_INSTITUTE_READ_TIMEOUT:5s}
    image-cache-directory: ${CURATIUM_ARTWORK_IMAGE_CACHE_DIRECTORY:./.curatium/artwork-images}
  cleveland-museum:
    base-url: ${CURATIUM_CLEVELAND_MUSEUM_BASE_URL:https://openaccess-api.clevelandart.org}
    image-base-url: ${CURATIUM_CLEVELAND_MUSEUM_IMAGE_BASE_URL:https://openaccess-cdn.clevelandart.org}
    connect-timeout: ${CURATIUM_CLEVELAND_MUSEUM_CONNECT_TIMEOUT:2s}
    read-timeout: ${CURATIUM_CLEVELAND_MUSEUM_READ_TIMEOUT:5s}
