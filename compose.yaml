services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: curatium
      POSTGRES_USER: curatium
      POSTGRES_PASSWORD: curatium
    ports:
      - "${CURATIUM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - curatium-postgres-data:/var/lib/postgresql/data

volumes:
  curatium-postgres-data:
